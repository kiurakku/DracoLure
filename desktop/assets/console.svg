    <text x="34" y="476" fill="#2b2f36">15:00:02</text><text x="180" y="476" fill="#2b2f36">203.0.113.4</text><text x="330" y="476" fill="#2b2f36">POST</text><text x="410" y="476" fill="#2b2f36">/api?x=${jndi:ldap://…}</text><text x="640" y="476" fill="#b00020">50</text><text x="710" y="476" fill="#b00020">high</text><text x="820" y="476" fill="#b00020">log4shell</text>
