name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build Go service
        run: |
          cd backend/go-service
          go mod tidy
          go build -v ./...

      - name: Build C++ analyzer
        run: |
          cd backend/cpp-analyzer
          cmake -S . -B build
          cmake --build build

      - name: Go unit tests
        run: |
          cd backend/go-service
          go test ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python detection-engine tests
        run: |
          python -m pip install --upgrade pip
          pip install "Flask>=3.0" "prometheus-client>=0.20" pytest
          cd app
          python -m pytest tests/ -q

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build db app go-service

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health; then
              break
            fi
            sleep 3
          done
          curl -fsS -X POST http://localhost:5000/attack \
            -H 'Content-Type: application/json' \
            -d '{"attack_type":"ci-smoke","source_ip":"10.0.0.1"}'
          curl -fsS http://localhost:8080/log

      - name: Tear down
        if: always()
        run: docker compose down -v
