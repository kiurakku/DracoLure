name: Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      # Keep deployment disabled until target environment and image references are configured.
      - name: Deployment placeholder
        run: echo "Build validation passed. Configure registry/image names and deployment target to enable rollout."
